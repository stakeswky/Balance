name: macOS Apple Silicon

on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*"

permissions:
  contents: read

jobs:
  build-macos-arm64:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.88.0
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target

      - name: Cache official Node runtime archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/synq-desktop
          key: node-v22.23.2-darwin-arm64

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run JavaScript tests
        run: npm test

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Prepare desktop web and Node sidecar
        run: npm run desktop:prepare

      - name: Run Rust tests
        run: npm run desktop:test

      - name: Build macOS Apple Silicon bundles
        run: npm run desktop:build

      - name: Verify and archive application
        run: |
          APP_PATH="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Synq.app"
          test -d "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" artifacts/Synq-macos-arm64.app.zip

      - name: Upload macOS bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Synq-macos-arm64
          if-no-files-found: error
          path: |
            artifacts/Synq-macos-arm64.app.zip
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
