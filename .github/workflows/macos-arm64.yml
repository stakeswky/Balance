name: macOS Apple Silicon

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "app-v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos-arm64:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Bump hot-update pack version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -eu
          case "${COMMIT_MSG:-}" in
            "chore(release): bump desktop pack"*)
              echo "skip pack bump on release commit"
              exit 0
              ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for _attempt in 1 2 3; do
            git fetch origin main
            remote_pack="$(git show origin/main:desktop-pack.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["packVersion"])')"
            BALANCE_REMOTE_PACK_VERSION="$remote_pack" node scripts/bump-desktop-pack-version.mjs
            git add desktop-pack.json
            next="$(python3 -c 'import json; print(json.load(open("desktop-pack.json"))["packVersion"])')"
            git commit -m "chore(release): bump desktop pack to ${next}" -m "[skip ci]"
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            git reset --hard HEAD~1
          done
          echo "failed to push pack version bump" >&2
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.88.0
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target

      - name: Cache official Node runtime archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/balance-desktop
          key: node-v22.23.2-darwin-arm64

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run JavaScript tests
        run: npm test

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Prepare desktop web and Node sidecar
        run: npm run desktop:prepare

      - name: Run Rust tests
        run: npm run desktop:test

      - name: Build macOS Apple Silicon bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run desktop:build

      - name: Verify desktop security, crash cleanup, and DMG
        run: npm run desktop:verify:ci

      - name: Verify and archive application
        run: |
          APP_PATH="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Balance.app"
          APP_BINARY="$APP_PATH/Contents/MacOS/balance-desktop"
          SIDECAR_BINARY="$APP_PATH/Contents/MacOS/balance-node"
          test -d "$APP_PATH"
          for binary in "$APP_BINARY" "$SIDECAR_BINARY"; do
            file_output=$(file "$binary")
            echo "$file_output"
            test "$file_output" = "$binary: Mach-O 64-bit executable arm64"
          done
          codesign --verify --deep --strict "$APP_PATH"
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" artifacts/Balance-macos-arm64.app.zip

      - name: Package sidecar hot-update assets
        run: node scripts/publish-desktop-update-artifacts.mjs

      - name: Upload macOS bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Balance-macos-arm64
          if-no-files-found: error
          path: |
            artifacts/Balance-macos-arm64.app.zip
            artifacts/balance-server.zip
            artifacts/update-manifest.json
            artifacts/latest.json
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Balance.app.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Balance.app.tar.gz.sig
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          shopt -s nullglob
          dmg_files=(src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/Balance_*.dmg)
          test "${#dmg_files[@]}" -eq 1
          DMG="${dmg_files[0]}"
          test -f "$DMG"
          ZIP="artifacts/Balance-macos-arm64.app.zip"
          test -f "$ZIP"
          HOT_ZIP="artifacts/balance-server.zip"
          test -f "$HOT_ZIP"
          MANIFEST="artifacts/update-manifest.json"
          test -f "$MANIFEST"
          LATEST="artifacts/latest.json"
          UPDATER="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Balance.app.tar.gz"
          SIG="$UPDATER.sig"
          test -f "$LATEST"
          test -f "$UPDATER"
          test -s "$SIG"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            gh release create "${GITHUB_REF_NAME}" "$DMG" "$ZIP" "$HOT_ZIP" "$MANIFEST" "$LATEST" "$UPDATER" "$SIG" \
              --title "Balance ${GITHUB_REF_NAME}" \
              --notes "Apple Silicon installer: $(basename "$DMG")" \
              --verify-tag
          else
            if gh release view latest >/dev/null 2>&1; then
              gh release delete latest --cleanup-tag --yes
            fi
            gh release create latest "$DMG" "$ZIP" "$HOT_ZIP" "$MANIFEST" "$LATEST" "$UPDATER" "$SIG" \
              --title "Balance macOS Apple Silicon" \
              --notes "Latest Apple Silicon build. Download $(basename "$DMG")." \
              --target "${GITHUB_SHA}" \
              --latest
          fi
