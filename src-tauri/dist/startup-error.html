<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Synq 无法启动</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #09090b; color: #ececee; }
      main { width: min(32rem, calc(100vw - 3rem)); padding: 2rem; border: 1px solid #29292d; border-radius: 1rem; background: #131316; }
      h1 { margin: 0 0 0.75rem; font-size: 1.35rem; }
      p { margin: 0.4rem 0; color: #b8b8bd; line-height: 1.6; }
      code { color: #c9a27a; }
    </style>
  </head>
  <body>
    <main>
      <h1>Synq 无法启动本地服务</h1>
      <p>请退出其他正在运行的 Synq，然后重新打开应用。</p>
      <p>Synq 需要使用本机端口 <code>127.0.0.1:4780</code>，不会连接未知的占用程序。</p>
    </main>
  </body>
</html>
